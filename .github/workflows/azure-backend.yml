# Deploy backend folder only to Azure Web App (llmshield-backend-py)
name: Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: llmshield-backend-py
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (for validation)
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt --quiet

      # Package contents of backend (not the folder itself) so run.py is at wwwroot root
      - name: Prepare package for Azure
        run: |
          mkdir -p deploy
          rsync -a --exclude='__pycache__' --exclude='*.pyc' backend/ deploy/
          ls -la deploy/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy
