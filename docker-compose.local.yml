# Local full-stack: backend + frontend + MongoDB
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# Backend will use MONGODB_URL=mongodb://mongodb:27017

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - BACKEND_CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80
    env_file:
      - ./backend/.env

volumes:
  mongodb_data:
